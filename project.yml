name: ClickerApp
options:
  bundleIdPrefix: com.example
targets:
  ClickerApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ClickerApp
    settings:
      base:
        PRODUCT_NAME: ClickerApp
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ClickerApp
        INFOPLIST_FILE: ClickerApp/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
